items:
    - id: anysearch
      name: AnySearch
      description:
          Search infrastructure for AI agents over MCP — general web search, vertical domain search, parallel batch
          search, and web page extraction. Gives AI agents up-to-date web knowledge for research, documentation lookup, and
          fact-checking.
      author: anysearch-team
      url: https://anysearch.com
      tags:
          - search-engine
          - web-search
          - ai-agents
          - content-extraction
          - research
      content:
          - name: Remote Server
            content: |
                {
                  "type": "streamable-http",
                  "url": "https://api.anysearch.com/mcp",
                  "headers": {
                    "Authorization": "Bearer {{ANYSEARCH_API_KEY}}"
                  }
                }
            parameters:
                - name: AnySearch API Key
                  key: ANYSEARCH_API_KEY
                  placeholder: your_anysearch_api_key
          - name: Remote Server (Anonymous)
            content: |
                {
                  "type": "streamable-http",
                  "url": "https://api.anysearch.com/mcp"
                }
    - id: atlassian
      name: Atlassian
      description:
          Comprehensive MCP server for Atlassian tools (Confluence and Jira) supporting both Cloud and Server/Data
          Center deployments with multiple authentication methods including API tokens, Personal Access Tokens, and OAuth
          2.0.
      author: sooperset
      url: https://github.com/sooperset/mcp-atlassian
      tags:
          - atlassian
          - jira
          - confluence
          - project-management
          - issue-tracking
          - documentation
          - collaboration
          - oauth
          - api-integration
      prerequisites:
          - Docker
          - Atlassian account (Cloud or Server/Data Center)
      content:
          - name: Docker
            prerequisites:
                - Docker
                - Atlassian Cloud account
            content: >
                {
                  "command": "docker",
                  "args": ["run", "-i", "--rm", "-e", "CONFLUENCE_URL", "-e", "CONFLUENCE_USERNAME", "-e", "CONFLUENCE_API_TOKEN", "-e", "JIRA_URL", "-e", "JIRA_USERNAME", "-e", "JIRA_API_TOKEN", "ghcr.io/sooperset/mcp-atlassian@sha256:27c8e5b890e16134a443f49683eaa794fdb48ed5bef785c1b4c88a0cd729df56"],
                  "env": {
                    "CONFLUENCE_URL": "{{CONFLUENCE_URL}}",
                    "CONFLUENCE_USERNAME": "{{CONFLUENCE_USERNAME}}",
                    "CONFLUENCE_API_TOKEN": "{{CONFLUENCE_API_TOKEN}}",
                    "JIRA_URL": "{{JIRA_URL}}",
                    "JIRA_USERNAME": "{{JIRA_USERNAME}}",
                    "JIRA_API_TOKEN": "{{JIRA_API_TOKEN}}"
                  }
                }
            parameters:
                - name: Confluence URL
                  key: CONFLUENCE_URL
                  placeholder: https://your-company.atlassian.net/wiki
                - name: Confluence Username
                  key: CONFLUENCE_USERNAME
                  placeholder: your.email@company.com
                - name: Confluence API Token
                  key: CONFLUENCE_API_TOKEN
                  placeholder: your_confluence_api_token
                - name: Jira URL
                  key: JIRA_URL
                  placeholder: https://your-company.atlassian.net
                - name: Jira Username
                  key: JIRA_USERNAME
                  placeholder: your.email@company.com
                - name: Jira API Token
                  key: JIRA_API_TOKEN
                  placeholder: your_jira_api_token
          - name: UVX
            prerequisites:
                - Python and uv
            content: >
                {
                  "command": "uvx",
                  "args": ["--from", "mcp-atlassian==0.11.9", "--hash", "sha256:1ba6a171b5299e554d4e0eff98279e74cdc4eb1c12c8e62be924103d9cd38e5e", "mcp-atlassian"],
                  "env": {
                    "CONFLUENCE_URL": "{{CONFLUENCE_URL}}",
                    "CONFLUENCE_USERNAME": "{{CONFLUENCE_USERNAME}}",
                    "CONFLUENCE_API_TOKEN": "{{CONFLUENCE_API_TOKEN}}",
                    "JIRA_URL": "{{JIRA_URL}}",
                    "JIRA_USERNAME": "{{JIRA_USERNAME}}",
                    "JIRA_API_TOKEN": "{{JIRA_API_TOKEN}}"
                  }
                }
            parameters:
                - name: Confluence URL
                  key: CONFLUENCE_URL
                  placeholder: https://your-company.atlassian.net/wiki
                - name: Confluence Username
                  key: CONFLUENCE_USERNAME
                  placeholder: your.email@company.com
                - name: Confluence API Token
                  key: CONFLUENCE_API_TOKEN
                  placeholder: your_confluence_api_token
                - name: Jira URL
                  key: JIRA_URL
                  placeholder: https://your-company.atlassian.net
                - name: Jira Username
                  key: JIRA_USERNAME
                  placeholder: your.email@company.com
                - name: Jira API Token
                  key: JIRA_API_TOKEN
                  placeholder: your_jira_api_token
    - id: azure-devops
      name: Azure DevOps
      description: Official Microsoft MCP server for Azure DevOps integration, bringing comprehensive Azure DevOps
          functionality directly to your AI agents. Supports work items, repositories, builds, releases, test plans, and
          search across your Azure DevOps organization with 50+ tools for complete DevOps automation.
      author: microsoft
      url: https://github.com/microsoft/azure-devops-mcp
      tags:
          - azure-devops
          - microsoft
          - devops
          - work-items
          - repositories
          - builds
          - releases
          - test-plans
          - project-management
          - ci-cd
          - version-control
          - pull-requests
          - search
          - official
      prerequisites:
          - Azure DevOps organization
          - Azure CLI authentication
      content:
          - name: NPX
            prerequisites:
                - Node.js
                - Azure CLI (logged in with az login)
            content: >
                {
                  "command": "npx",
                  "args": ["-y", "@azure-devops/mcp@1.0.0", "--hash", "sha1:742d3aa74ec8a13283a62c77c9fc5c2a0d276624", "{{AZURE_DEVOPS_ORG}}"]
                }
            parameters:
                - name: Azure DevOps Organization
                  key: AZURE_DEVOPS_ORG
                  placeholder: contoso
    - id: context7
      name: Context7
      description:
          Up-to-date code documentation for LLMs and AI code editors. Provides version-specific documentation and
          code examples straight from the source, eliminating outdated or hallucinated API information.
      author: upstash
      url: https://github.com/upstash/context7
      tags:
          - documentation
          - code-examples
          - library-docs
          - up-to-date
          - api-reference
          - development
      content:
          - name: NPX
            content: |
                {
                  "command": "npx",
                  "args": ["-y", "@upstash/context7-mcp"],
                  "env": {
                    "DEFAULT_MINIMUM_TOKENS": "{{DEFAULT_MINIMUM_TOKENS}}"
                  }
                }
            parameters:
                - name: Default Minimum Tokens
                  key: DEFAULT_MINIMUM_TOKENS
                  placeholder: "6000"
                  optional: true
            prerequisites:
                - Node.js
          - name: Remote Server
            content: |
                {
                  "type": "streamable-http",
                  "url": "https://mcp.context7.com/mcp"
                }
    - id: dbt
      name: dbt
      description:
          A MCP server for interacting with dbt, providing AI agents with context from dbt Core, dbt Fusion, and dbt
          Platform. Supports SQL execution, Semantic Layer queries, project discovery, dbt CLI operations, Admin API
          management, code generation, and column-level lineage tracing.
      author: dbt-labs
      url: https://github.com/dbt-labs/dbt-mcp
      tags:
          - dbt
          - data-engineering
          - data-analytics
          - sql
          - semantic-layer
          - data-modeling
          - mcp-server
          - llm
      prerequisites:
          - Python and uv
      content:
          - name: UVX (dbt Cloud)
            description:
                Uses OAuth to authenticate with your dbt Cloud account. Provides platform features (Discovery API, Semantic
                Layer, job management) without local CLI commands.
            prerequisites:
                - dbt Cloud account with static subdomain
            content: |
                {
                  "command": "uvx",
                  "args": ["dbt-mcp"],
                  "env": {
                    "DBT_HOST": "{{DBT_HOST}}"
                  }
                }
          - name: UVX (dbt Cloud + CLI)
            description:
                Uses OAuth with dbt Cloud and also enables local dbt CLI commands for running, building, and testing dbt
                projects.
            prerequisites:
                - dbt Cloud account with static subdomain
                - dbt CLI installed locally
            content: |
                {
                  "command": "uvx",
                  "args": ["dbt-mcp"],
                  "env": {
                    "DBT_HOST": "{{DBT_HOST}}",
                    "DBT_PROJECT_DIR": "{{DBT_PROJECT_DIR}}",
                    "DBT_PATH": "{{DBT_PATH}}"
                  }
                }
            parameters:
                - name: dbt Project Directory
                  key: DBT_PROJECT_DIR
                  placeholder: /path/to/your/dbt/project
                - name: dbt Executable Path
                  key: DBT_PATH
                  placeholder: /path/to/your/dbt/executable
          - name: UVX (CLI only)
            description: Runs dbt MCP locally with your dbt project using dbt Core or Fusion CLI. No dbt Cloud account required.
            prerequisites:
                - dbt CLI installed locally
            content: |
                {
                  "command": "uvx",
                  "args": ["dbt-mcp"],
                  "env": {
                    "DBT_PROJECT_DIR": "{{DBT_PROJECT_DIR}}",
                    "DBT_PATH": "{{DBT_PATH}}"
                  }
                }
            parameters:
                - name: dbt Project Directory
                  key: DBT_PROJECT_DIR
                  placeholder: /path/to/your/dbt/project
                - name: dbt Executable Path
                  key: DBT_PATH
                  placeholder: /path/to/your/dbt/executable
          - name: Docker
            description:
                Container-based installation using a dbt Cloud service token for authentication. Provides platform features
                without local dbt installation.
            prerequisites:
                - Docker
                - dbt Cloud account
                - dbt Cloud service token
            content: >
                {
                  "command": "docker",
                  "args": ["run", "-i", "--rm", "-e", "DBT_HOST", "-e", "DBT_TOKEN", "-e", "DBT_PROD_ENV_ID", "ghcr.io/dbt-labs/dbt-mcp:latest"],
                  "env": {
                    "DBT_HOST": "{{DBT_HOST}}",
                    "DBT_TOKEN": "{{DBT_TOKEN}}",
                    "DBT_PROD_ENV_ID": "{{DBT_PROD_ENV_ID}}"
                  }
                }
            parameters:
                - name: dbt Production Environment ID
                  key: DBT_PROD_ENV_ID
                  placeholder: your_production_environment_id
                - name: dbt Service Token
                  key: DBT_TOKEN
                  placeholder: your_dbt_service_token
      parameters:
          - name: dbt Host
            key: DBT_HOST
            placeholder: cloud.getdbt.com
    - id: esignatures
      name: eSignatures
      description:
          Manages digital contract workflows including creation, sending, and template management for electronic
          signatures through the eSignatures platform.
      author: esignaturescom
      url: https://github.com/esignaturescom/mcp-server-esignatures
      tags:
          - digital-signatures
          - contracts
          - document-management
          - templates
          - collaboration
      content:
          - name: UVX
            prerequisites:
                - Python
                - uv
            content: |
                {
                  "command": "uvx",
                  "args": ["mcp-server-esignatures"],
                  "env": {
                    "ESIGNATURES_SECRET_TOKEN": "{{ESIGNATURES_SECRET_TOKEN}}"
                  }
                }
          - name: UV Development
            prerequisites:
                - Python
                - uv
            content: |
                {
                  "command": "uv",
                  "args": [
                    "--directory",
                    "{{ESIGNATURES_PATH}}",
                    "run",
                    "mcp-server-esignatures"
                  ],
                  "env": {
                    "ESIGNATURES_SECRET_TOKEN": "{{ESIGNATURES_SECRET_TOKEN}}"
                  }
                }
            parameters:
                - name: eSignatures Path
                  key: ESIGNATURES_PATH
                  placeholder: /path/to/mcp-server-esignatures
                  optional: true
      parameters:
          - name: eSignatures Secret Token
            key: ESIGNATURES_SECRET_TOKEN
            placeholder: your_esignatures_api_secret_token
    - id: exa
      name: Exa Search
      description:
          Enables AI assistants to perform real-time web searches using Exa's AI Search API, providing structured
          results with titles, URLs, and content snippets.
      author: exa-labs
      url: https://github.com/exa-labs/exa-mcp-server
      tags:
          - web-search
          - exa-api
          - real-time-data
          - content-discovery
          - information-retrieval
      prerequisites:
          - Exa account
      content:
          - name: NPX
            prerequisites:
                - Node.js
            content: |
                {
                  "command": "npx",
                  "args": ["-y", "exa-mcp-server"],
                  "env": {
                    "EXA_API_KEY": "{{EXA_API_KEY}}"
                  }
                }
          - name: NPX with Specific Tools
            prerequisites:
                - Node.js
            content: |
                {
                  "command": "npx",
                  "args": ["-y", "exa-mcp-server", "--tools=web_search_exa,research_paper_search,company_research"],
                  "env": {
                    "EXA_API_KEY": "{{EXA_API_KEY}}"
                  }
                }
          - name: Remote MCP
            prerequisites:
                - Node.js
            content: |
                {
                  "command": "npx",
                  "args": ["-y", "mcp-remote", "https://mcp.exa.ai/mcp?exaApiKey={{EXA_API_KEY}}"]
                }
          - name: Smithery Installation
            prerequisites:
                - Node.js
            content: |
                {
                  "command": "npx",
                  "args": ["-y", "@smithery/cli", "install", "exa", "--client", "claude"]
                }
      parameters:
          - name: Exa API Key
            key: EXA_API_KEY
            placeholder: your_exa_api_key_here
    - id: figma-dev-mode
      name: Figma Dev Mode
      description:
          Brings Figma directly into your workflow by providing important design information and context to AI agents
          generating code from Figma design files. Enables code generation from selected frames, design context extraction,
          and Code Connect integration.
      author: figma
      url: https://help.figma.com/hc/en-us/articles/32132100833559-Guide-to-the-Dev-Mode-MCP-Server
      tags:
          - figma
          - design-to-code
          - ui-development
          - design-systems
          - code-generation
          - dev-mode
      content:
          - name: Figma Dev Mode
            content: |
                {
                  "type": "sse",
                  "url": "http://127.0.0.1:3845/sse"
                }
    - id: filesystem
      name: File System
      description: Provides comprehensive filesystem operations including reading, writing, moving files, directory
          management, and advanced file editing with pattern matching and formatting capabilities.
      author: modelcontextprotocol
      url: https://github.com/modelcontextprotocol/servers/tree/main/src/filesystem
      tags:
          - filesystem
          - file-management
          - directory-operations
          - file-search
          - file-editing
      content:
          - name: NPX
            prerequisites:
                - Node.js
            content: |
                {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-filesystem", "{{ALLOWED_DIRECTORY}}"]
                }
          - name: Docker
            prerequisites:
                - Docker
            content: >
                {
                  "command": "docker",
                  "args": ["run", "-i", "--rm", "--mount", "type=bind,src={{ALLOWED_DIRECTORY}},dst=/projects", "mcp/filesystem", "/projects"]
                }
      parameters:
          - name: Allowed Directory
            key: ALLOWED_DIRECTORY
            placeholder: /Users/username/Documents
    - id: firebase
      name: Firebase
      description:
          The Firebase MCP server allows AI-powered development tools to work with your Firebase projects. It can
          create and manage Firebase projects, manage Authentication users, work with data in Cloud Firestore and Data
          Connect, retrieve schemas, understand security rules, and send messages with Cloud Messaging.
      author: firebase
      url: https://firebase.google.com/docs/cli/mcp-server
      tags:
          - firebase
          - gcp
          - firestore
          - authentication
          - cloud-functions
          - hosting
          - storage
          - data-connect
          - cloud-messaging
      content:
          - name: NPX
            prerequisites:
                - Node.js
            content: |
                {
                  "command": "npx",
                  "args": ["-y", "firebase-tools@14.15.2", "experimental:mcp"]
                }
          - name: NPX with Options
            prerequisites:
                - Node.js
            content: >
                {
                  "command": "npx",
                  "args": ["-y", "firebase-tools@14.15.2", "experimental:mcp", "--dir", "{{FIREBASE_DIR}}", "--only", "{{FIREBASE_ONLY}}"]
                }
            parameters:
                - name: Project Directory
                  key: FIREBASE_DIR
                  placeholder: /Users/turing/my-project
                  optional: true
                - name: Feature Groups
                  key: FIREBASE_ONLY
                  placeholder: auth,firestore,storage
                  optional: true
    - id: genkit
      name: Genkit Integration
      description:
          Enables bi-directional integration with Model Context Protocol, allowing applications to both consume MCP
          tools/prompts as a client and expose Genkit tools/prompts as an MCP server.
      author: firebase
      url: https://github.com/firebase/genkit/tree/HEAD/js/plugins/mcp
      tags:
          - mcp-integration
          - client-server
          - tools-prompts
          - plugin
          - genkit
      prerequisites:
          - Node.js 18+
          - Genkit SDK
      content:
          - name: NPM Installation
            prerequisites:
                - Node.js 18+
            content: |
                {
                  "command": "npm",
                  "args": ["install", "@genkit-ai/mcp"]
                }
          - name: Custom MCP Server Setup
            content: |
                {
                  "command": "node",
                  "args": ["your-genkit-mcp-server.js"]
                }
      parameters:
          - name: Prerequisites
            key: PREREQUISITES
            placeholder: Requires Node.js 18+ and Genkit SDK installation
    - id: git
      name: Git Tools
      description: Provides Git repository interaction and automation tools for reading, searching, and manipulating Git
          repositories through commands like status, diff, commit, branch management, and more.
      author: modelcontextprotocol
      url: https://github.com/modelcontextprotocol/servers/tree/main/src/git
      tags:
          - git
          - version-control
          - repository-management
          - source-control
          - development
      content:
          - name: UVX
            prerequisites:
                - Python and uv
            content: |
                {
                  "command": "uvx",
                  "args": ["mcp-server-git", "--repository", "{{REPOSITORY_PATH}}"]
                }
          - name: NPX
            prerequisites:
                - Node.js
            content: >
                {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/inspector", "uvx", "mcp-server-git", "--repository", "{{REPOSITORY_PATH}}"]
                }
          - name: Python/Pip
            prerequisites:
                - Python
            content: |
                {
                  "command": "python",
                  "args": ["-m", "mcp_server_git", "--repository", "{{REPOSITORY_PATH}}"]
                }
          - name: Docker
            prerequisites:
                - Docker
            content: |
                {
                  "command": "docker",
                  "args": ["run", "--rm", "-i", "--mount", "type=bind,src={{REPOSITORY_PATH}},dst=/workspace", "mcp/git"]
                }
      parameters:
          - name: Repository Path
            key: REPOSITORY_PATH
            placeholder: /path/to/git/repo
    - id: git-mcp
      name: GitMCP
      description:
          GitMCP is a free, open-source, remote MCP server that transforms any GitHub project (repositories or GitHub
          pages) into a documentation hub. It enables AI tools like Cursor to access up-to-date documentation and code, even
          if the LLM has never encountered them, thereby eliminating code hallucinations seamlessly.
      author: idosal
      url: https://github.com/idosal/git-mcp
      tags:
          - git
          - github
          - documentation
          - code-search
          - repository-management
          - hallucination-reduction
      content:
          - name: SSE
            content: |
                {
                  "type": "streamable-http",
                  "url": "https://gitmcp.io/{{OWNER}}/{{REPO}}"
                }
            parameters:
                - name: Owner
                  key: OWNER
                  placeholder: microsoft
                - name: Repo
                  key: REPO
                  placeholder: typescript
          - name: NPX
            prerequisites:
                - Node.js
            content: |
                {
                  "command": "npx",
                  "args": ["-y", "mcp-remote@0.1.29", "https://gitmcp.io/{{OWNER}}/{{REPO}}"]
                }
            parameters:
                - name: Owner
                  key: OWNER
                  placeholder: microsoft
                - name: Repo
                  key: REPO
                  placeholder: typescript
    - id: google-workspace
      name: Google Workspace
      description:
          Control Gmail, Google Calendar, Docs, Sheets, Slides, Chat, Forms, Tasks, Search & Drive with AI. The most
          feature-complete Google Workspace / G Suite MCP server.
      author: taylorwilsdon
      url: https://github.com/taylorwilsdon/google_workspace_mcp
      tags:
          - google-workspace
          - g-suite
          - google-drive
          - google-sheets
          - google-docs
          - gmail
          - google-calendar
          - automation
          - api-integration
      prerequisites:
          - Google Cloud Project with OAuth 2.0 credentials
      content:
          - name: UVX (Local)
            prerequisites:
                - Python and uv
            content: >
                {
                  "command": "uvx",
                  "args": ["--from", "workspace-mcp==1.4.7", "--hash", "sha256:4e98810f46bd370007e7c9a9337bcaf47cb91e21fed8fb59cf7c68d5a539a49f", "workspace-mcp", "--tool-tier", "core"],
                  "env": {
                    "GOOGLE_OAUTH_CLIENT_ID": "{{GOOGLE_OAUTH_CLIENT_ID}}",
                    "GOOGLE_OAUTH_CLIENT_SECRET": "{{GOOGLE_OAUTH_CLIENT_SECRET}}",
                    "OAUTHLIB_INSECURE_TRANSPORT": "1"
                  }
                }
      parameters:
          - name: Google OAuth Client ID
            key: GOOGLE_OAUTH_CLIENT_ID
            placeholder: your-google-oauth-client-id
          - name: Google OAuth Client Secret
            key: GOOGLE_OAUTH_CLIENT_SECRET
            placeholder: your-google-oauth-client-secret
    - id: ida-pro
      name: IDA Pro
      description: An MCP server for interacting with the IDA Pro disassembler.
      author: mrexodia
      url: https://github.com/mrexodia/ida-pro-mcp
      tags:
          - ida-pro
          - reverse-engineering
          - disassembler
          - debugging
          - security
      content:
          - name: UVX
            prerequisites:
                - Python and uv
                - Git
            content: >
                {
                  "command": "uvx",
                  "args": ["--from", "git+https://github.com/mrexodia/ida-pro-mcp.git@f0af9fba733fb60fc13365b297b10c82db3771d7", "ida-pro-mcp"]
                }
    - id: kagi
      name: Kagi Search
      description:
          Integrates Kagi's advanced search API to provide AI assistants with up-to-date web search capabilities and
          accurate information retrieval.
      author: kagisearch
      url: https://github.com/kagisearch/kagimcp
      tags:
          - web-search
          - information-retrieval
          - kagi-api
          - real-time-data
          - search-engine
      prerequisites:
          - Kagi account
      content:
          - name: UVX
            prerequisites:
                - Python
                - uv
            content: |
                {
                  "command": "uvx",
                  "args": ["kagimcp"],
                  "env": {
                    "KAGI_API_KEY": "{{KAGI_API_KEY}}",
                    "KAGI_SUMMARIZER_ENGINE": "{{KAGI_SUMMARIZER_ENGINE}}"
                  }
                }
          - name: Smithery Installation
            prerequisites:
                - Node.js
            content: |
                {
                  "command": "npx",
                  "args": ["-y", "@smithery/cli", "install", "kagimcp", "--client", "claude"]
                }
          - name: Local Development
            content: |
                {
                  "command": "uv",
                  "args": ["--directory", "{{KAGI_PATH}}", "run", "kagimcp"],
                  "env": {
                    "KAGI_API_KEY": "{{KAGI_API_KEY}}",
                    "KAGI_SUMMARIZER_ENGINE": "{{KAGI_SUMMARIZER_ENGINE}}"
                  }
                }
            parameters:
                - name: Kagi Path
                  key: KAGI_PATH
                  placeholder: /path/to/kagimcp
                  optional: true
      parameters:
          - name: Kagi API Key
            key: KAGI_API_KEY
            placeholder: your_kagi_api_key_here
          - name: Kagi Summarizer Engine
            key: KAGI_SUMMARIZER_ENGINE
            placeholder: cecil
            optional: true
    - id: keenable
      name: Keenable
      description:
          Web search and page fetch for AI agents over MCP. Search the web and read pages as clean markdown. No account
