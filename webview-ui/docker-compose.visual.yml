services:
    visual:
        image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
        ipc: host
        user: "${UID:-1000}:${GID:-1000}"
        working_dir: /work
        environment:
            COREPACK_HOME: /work/node_modules/.cache/corepack
            HOME: /tmp/playwright
        volumes:
            - ..:/work
        command: sh -lc "corepack pnpm --filter @roo-code/vscode-webview test:visual"
