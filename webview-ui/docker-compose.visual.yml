services:
    visual:
        image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
        ipc: host
        user: "${UID:-1000}:${GID:-1000}"
        working_dir: /work
        environment:
            COREPACK_HOME: /work/node_modules/.cache/corepack
            HOME: /tmp/playwright
        volumes:
            - ..:/work
        command: sh -lc "corepack pnpm --filter @roo-code/vscode-webview test:visual"
