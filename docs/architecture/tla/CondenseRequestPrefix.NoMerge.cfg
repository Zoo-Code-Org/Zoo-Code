\* A builder that skips the merge step. Breaks PrefixUnchanged on
\* consecutive user messages.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Mode = "NoMerge"
    MaxMsgs = 3
    MaxBlocks = 2
    SysTask = "task-prompt"
    SysCondense = "condense-prompt"
    SupportsImages = TRUE
INVARIANTS TypeOK PrefixUnchanged
