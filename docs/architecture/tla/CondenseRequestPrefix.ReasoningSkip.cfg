\* Skipping the task history cleaner: embedded reasoning reaches the request
\* still embedded. Breaks NoEmbeddedReasoning on any history whose assistant
\* message starts with an embedded reasoning block.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Mode = "ReasoningSkip"
    MaxMsgs = 3
    MaxBlocks = 2
    SysTask = "task-prompt"
    SysCondense = "condense-prompt"
    SupportsImages = TRUE
INVARIANTS TypeOK NoEmbeddedReasoning
