\* The old condense request: tool blocks converted to text. Breaks
\* PrefixUnchanged on any history that carries a tool block.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Mode = "TextConvert"
    MaxMsgs = 3
    MaxBlocks = 2
    SysTask = "task-prompt"
    SysCondense = "condense-prompt"
    SupportsImages = TRUE
INVARIANTS TypeOK PrefixUnchanged
