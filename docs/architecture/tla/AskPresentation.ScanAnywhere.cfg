SPECIFICATION Spec
CONSTANTS
    Inputs <- MCInputs
    Variant = "ScanAnywhere"
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoMaskedPendingAsk NoStaleRunButton ReqSupersedes NoSettledKeptOrRestored NoStampOnPartial NoRoutePastNewestRow NoHiddenPendingCaTail
\* Sabotage (review 6088358220): the send/deny lookup scans the whole
\* history for the newest pending command ask, so an older cancelled ask
\* matches past a newer partial ask or api_req_started. The host discards
\* the orphan response and the message is lost.
\* NoRoutePastNewestRow must fail. Review r10 4724761110: this sabotage
\* changes only RouteMatchCa; NoHiddenPendingCaTail is the StampClears
\* shape and stays with that variant.
