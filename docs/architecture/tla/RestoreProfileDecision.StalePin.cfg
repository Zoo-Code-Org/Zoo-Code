\* RestoreProfileDecision.StalePin.cfg — sabotage: the no-write path keeps the
\* previous modeled pin instead of the pin the selected input carried in, so the
\* modeled pin diverges from the persisted history-item pin.
\* NoWritePreservesPin must be the violated invariant.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    NoActive = "none"
    PersistedPin <- PersistedPinStale
INVARIANTS TypeOK FollowActive PinNamesEffect LegacyFallback RefreshPersists WriteFailureRestores NoWritePreservesPin
