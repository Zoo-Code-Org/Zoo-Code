\* Sabotage (review 6084536709): the superseded ask's cleanup clears the arm
\* slot unconditionally and wipes a newer ask's armed token -- the exact wipe
\* the keeps-a-newer-ask's-token test forbids. ArmSlotCurrent must fail.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    MaxAsks = 2
    Orphan = 0
    MaxArrivals = 3
    StaleCleanup <- StaleCleanupStaleWipe
INVARIANTS TypeOK OnlyOwnResponse NoOrphanApproval OnlyOwnPublishedResponse NoStaleConsumption ArmOnlyWhileCurrent ArmSlotCurrent
