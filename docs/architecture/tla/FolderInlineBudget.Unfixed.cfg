\* The code before the fix: no caps. The MC module swaps the fixed step for
\* the unfixed one with the operator override below. With the per-file pins
\* raised to the extraction max, TotalCapInv alone is decisive here and must
\* fail.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
	N = 3
	MaxLines = 4
	MaxChars = 2
	PerFileCap = 4
	TotalCap = 12
	PerFileCharsCap = 2
	TotalCharsCap = 6
	NotesOn = TRUE
	PinPerFile = 4
	PinTotal = 4
	PinPerFileChars = 2
	PinTotalChars = 6
	FixedStep <- UnfixedStep
INVARIANTS TypeOK TotalCapInv PerFileCapInv CharTotalCapInv CharPerFileCapInv SkippedReadable AllShownAccounted
