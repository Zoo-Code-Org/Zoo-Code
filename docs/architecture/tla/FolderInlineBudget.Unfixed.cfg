	N = 3
	MaxLines = 3
	MaxChars = 3
	PerFileCap = 4
	TotalCap = 12
	PerFileCharsCap = 3
	TotalCharsCap = 9
	NotesOn = TRUE
	PinPerFile = 4
	PinTotal = 4
	PinPerFileChars = 3
	PinTotalChars = 9
	FixedStep <- UnfixedStep
INVARIANTS TypeOK TotalCapInv PerFileCapInv CharTotalCapInv CharPerFileCapInv ChargeConsistentInv SkippedReadable AllShownAccounted
