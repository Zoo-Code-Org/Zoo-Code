\* Sabotage: the ownership gate is removed. OnlyOwnResponse must fail.
\* The consume is bound to the armed wait phase, so the failing trace
\* publishes and arms first: an entry-window orphan survives the preserving
\* arm and the ungated wait consumes it after publication (review 6093228862).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    MaxAsks = 2
    Orphan = 0
    MaxArrivals = 3
    Consume <- ConsumeNoGate
INVARIANTS TypeOK OnlyOwnResponse NoOrphanApproval OnlyOwnPublishedResponse NoStaleConsumption ArmOnlyWhileCurrent ArmSlotCurrent
