\* Sabotage check (CR thread 4727751392). The pre-fix process-wide ledger:
\* the resolution reads the lifetime pairs and refuses a conflicted name for
\* good, whatever its scopes do. After the conflicting scope ends, the
\* surviving pair alone is live, so the call is unambiguous at call time, yet
\* the name still resolves to nothing. The run must fail ExactRoundTrip and
\* ActiveScopeResolves; the fix's EndScope restores the resolution instead.
SPECIFICATION Spec
CONSTANTS
    Servers = {"Sv", "Sv.m"}
    Tools = {"Tl", "Tl.x"}
    WireNames = {"Sv", "Svm", "Tl", "Tlx"}
    Scopes = {"sa", "sb"}
ReadL <- ReadLStale
INVARIANTS TypeOK ExactRoundTrip FirstPairStable AmbiguousNamesRefuse ActiveScopeResolves
CHECK_DEADLOCK FALSE
