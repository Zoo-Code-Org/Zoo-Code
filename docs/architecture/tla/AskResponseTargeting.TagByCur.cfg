\* Sabotage: the tag is written from the minted ask, not the awaiting ask.
\* OnlyOwnResponse must fail (an orphan consumed during the entry window).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    MaxAsks = 2
    Orphan = 0
    MaxArrivals = 3
    Arrive <- ArriveTagByCur
INVARIANTS TypeOK OnlyOwnResponse NoOrphanApproval
