\* Sabotage: the per-file line cap is removed. PerFileCapInv must fail while
\* TotalCapInv still holds (the pins differ, so one failure is decisive).
\* The character caps sit at the extraction max, so a character cut cannot
\* mask the line failure, and the character invariants must hold.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
	N = 3
	MaxLines = 3
	MaxChars = 3
	PerFileCap = 4
	TotalCap = 12
	PerFileCharsCap = 3
	TotalCharsCap = 9
	NotesOn = TRUE
	PinPerFile = 2
	PinTotal = 12
	PinPerFileChars = 3
	PinTotalChars = 9
INVARIANTS TypeOK TotalCapInv PerFileCapInv CharTotalCapInv CharPerFileCapInv ChargeConsistentInv SkippedReadable AllShownAccounted
