\* Sabotage: the per-file line cap is removed. PerFileCapInv must fail while
\* TotalCapInv still holds (the pins differ, so one failure is decisive).
\* The character caps stay on, so the character invariants must hold.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
	N = 3
	MaxLines = 4
	MaxChars = 2
	PerFileCap = 4
	TotalCap = 12
	PerFileCharsCap = 1
	TotalCharsCap = 3
	NotesOn = TRUE
	PinPerFile = 2
	PinTotal = 12
	PinPerFileChars = 1
	PinTotalChars = 3
INVARIANTS TypeOK TotalCapInv PerFileCapInv CharTotalCapInv CharPerFileCapInv SkippedReadable AllShownAccounted
