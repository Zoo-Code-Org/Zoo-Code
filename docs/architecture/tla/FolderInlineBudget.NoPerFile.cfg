\* Sabotage: the per-file cap is removed. PerFileCapInv must fail while
\* TotalCapInv still holds (the pins differ, so one failure is decisive).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
	N = 3
	MaxLines = 4
	PerFileCap = 4
	TotalCap = 12
	NotesOn = TRUE
	PinPerFile = 2
	PinTotal = 12
	Mode = "Fixed"
INVARIANTS TypeOK TotalCapInv PerFileCapInv SkippedReadable AllShownAccounted
