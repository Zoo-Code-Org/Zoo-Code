	N = 3
	MaxLines = 3
	MaxChars = 3
	PerFileCap = 2
	TotalCap = 4
	PerFileCharsCap = 3
	TotalCharsCap = 9
	NotesOn = TRUE
	PinPerFile = 2
	PinTotal = 4
	PinPerFileChars = 1
	PinTotalChars = 3
INVARIANTS TypeOK TotalCapInv PerFileCapInv CharTotalCapInv CharPerFileCapInv ChargeConsistentInv SkippedReadable AllShownAccounted
