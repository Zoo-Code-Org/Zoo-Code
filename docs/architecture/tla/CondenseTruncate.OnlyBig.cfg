\* PR 2696 review round 2: the unfixed scan accepts only the first oversized
\* block, so a message whose first block is cleared leaves the scan and the
\* round reports Error while the second block still contributes weight.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Mode = "OnlyBig"
    MaxMsgs = 7
CONSTRAINT Bounded
INVARIANTS TypeOK ErrExhaustsCandidates
