name: Publish Stable Extension

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Least privilege: publish-stable escalates to contents: write via its own
# job-level permissions block.
permissions:
  contents: read

jobs:
  check-pr-approval:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check PR approval status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          pr_number=$(gh api "repos/${REPO}/commits/${SHA}/pulls" \
            --header "Accept: application/vnd.github+json" \
            --jq '.[0].number // empty')

          if [ -z "$pr_number" ]; then
            echo "No PR found for commit ${SHA}. Deployment requires an approved PR."
            exit 1
          fi

          review_decision=$(gh api graphql \
            -f owner="${REPO%%/*}" \
            -f name="${REPO#*/}" \
            -F number="$pr_number" \
            -f query='
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    reviewDecision
                  }
                }
              }' \
            --jq '.data.repository.pullRequest.reviewDecision // "NONE"')

          echo "PR #${pr_number} review_decision: ${review_decision}"

          if [ "$review_decision" != "APPROVED" ]; then
            echo "PR #${pr_number} is not approved (state: ${review_decision}). Deployment blocked."
            exit 1
          fi

          echo "PR #${pr_number} is approved. Proceeding."

  publish-stable:
    needs: [check-pr-approval]
    runs-on: ubuntu-latest
    environment: marketplace-production
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      source_sha: ${{ github.sha }}
      release_url: ${{ steps.release.outputs.release_url }}
      changes: ${{ steps.release.outputs.changes }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          install-args: "--frozen-lockfile"

      - name: Validate package identity
        run: |
          package_name=$(node -p "require('./src/package.json').name")
          publisher=$(node -p "require('./src/package.json').publisher")

          test "$package_name" = "zoo-code"
          test "$publisher" = "ZooCodeOrganization"

      - name: Validate publish ref
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Manual stable publishes must run from main, not ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Validate release tag
        if: github.event_name == 'push'
        run: |
          package_version=$(node -p "require('./src/package.json').version")
          tag_version="${GITHUB_REF_NAME#v}"

          if [ "$package_version" != "$tag_version" ]; then
            echo "Tag v${tag_version} does not match src/package.json version ${package_version}."
            exit 1
          fi

      - name: Build workspace packages
        run: |
          pnpm --filter @roo-code/build build
          pnpm --filter @roo-code/vscode-webview build

      - name: Package extension
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: |
          package_version=$(node -p "require('./src/package.json').version")
          pnpm --filter ./src vsix

          vsix_path="bin/zoo-code-${package_version}.vsix"
          test -f "$vsix_path"

          unzip -l "$vsix_path" > /tmp/zoo-code-vsix-contents.txt
          grep -q "extension/package.json" /tmp/zoo-code-vsix-contents.txt
          grep -q "extension/package.nls.json" /tmp/zoo-code-vsix-contents.txt
          grep -q "extension/dist/extension.js" /tmp/zoo-code-vsix-contents.txt
          grep -q "extension/webview-ui/audio/celebration.wav" /tmp/zoo-code-vsix-contents.txt
          grep -q "extension/webview-ui/build/assets/index.js" /tmp/zoo-code-vsix-contents.txt
          grep -q "extension/assets/codicons/codicon.ttf" /tmp/zoo-code-vsix-contents.txt
          grep -q "extension/assets/vscode-material-icons/icons/3d.svg" /tmp/zoo-code-vsix-contents.txt

      - name: Validate packaged manifest identity
        run: |
          package_version=$(node -p "require('./src/package.json').version")
          vsix_path="bin/zoo-code-${package_version}.vsix"

          artifact_name=$(unzip -p "$vsix_path" extension/package.json | jq -r '.name')
          artifact_publisher=$(unzip -p "$vsix_path" extension/package.json | jq -r '.publisher')

          test "$artifact_name" = "zoo-code"
          test "$artifact_publisher" = "ZooCodeOrganization"

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          package_version=$(node -p "require('./src/package.json').version")
          npx @vscode/vsce publish --packagePath "bin/zoo-code-${package_version}.vsix"
          echo "Published ZooCodeOrganization.zoo-code ${package_version} to VS Code Marketplace"

      - name: Publish to Open VSX Registry
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          package_version=$(node -p "require('./src/package.json').version")
          pnpm exec ovsx publish "bin/zoo-code-${package_version}.vsix" --skip-duplicate
          echo "Published ZooCodeOrganization.zoo-code ${package_version} to Open VSX Registry"

      - name: Create GitHub release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package_version=$(node -p "require('./src/package.json').version")
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag_name="$GITHUB_REF_NAME"
          else
            tag_name="v${package_version}"
          fi
          vsix_path="bin/zoo-code-${package_version}.vsix"

          changelog_content=$(awk -v version="$package_version" '
            $0 ~ "^## \\[" version "\\]" { found = 1 }
            found && $0 == "---" { exit }
            found && $0 ~ "^## " && $0 !~ "^## \\[" version "\\]" { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$changelog_content" ]; then
            changelog_content="Release ${tag_name}"
          fi
          printf "%s\n" "$changelog_content" > /tmp/zoo-code-release-notes.md

          if gh release view "$tag_name" >/dev/null 2>&1; then
            gh release upload "$tag_name" "$vsix_path" --clobber
          else
            gh release create "$tag_name" \
              --title "Zoo Code ${tag_name}" \
              --notes-file /tmp/zoo-code-release-notes.md \
              --target "$GITHUB_SHA" \
              "$vsix_path"
          fi

          # Expose release context for the docs dispatch job so the payload is
          # rebuilt deterministically from what was actually published.
          release_url=$(gh release view "$tag_name" --json url --jq .url)
          echo "version=${package_version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "release_url=${release_url}" >> "$GITHUB_OUTPUT"
          {
            echo "changes<<__ZOO_CHANGELOG_EOF__"
            printf "%s\n" "$changelog_content"
            echo "__ZOO_CHANGELOG_EOF__"
          } >> "$GITHUB_OUTPUT"

  # Fire-and-forget docs release trigger. The docs release runs in
  # Zoo-Code-Org/Zoo-Code-Docs and must never invalidate or roll back an
  # already-published extension, so this job is continue-on-error and surfaces
  # problems as warning annotations only. The payload is rebuilt from
  # publish-stable outputs, so re-running this job re-sends the identical
  # event for the same release (the docs repo dedupes on it).
  dispatch-docs-release:
    needs: [publish-stable]
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      # Cross-repo dispatch intentionally does NOT use GITHUB_TOKEN.
      # One-time setup (human): create a GitHub App with `contents: write` on
      # Zoo-Code-Org/Zoo-Code-Docs ONLY (repository_dispatch requires contents
      # write on the target repo), install it on that repo, and store its
      # credentials in this repo as the DOCS_DISPATCH_APP_ID and
      # DOCS_DISPATCH_APP_PRIVATE_KEY secrets.
      - name: Mint least-privilege token for Zoo-Code-Docs
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DOCS_DISPATCH_APP_ID }}
          private-key: ${{ secrets.DOCS_DISPATCH_APP_PRIVATE_KEY }}
          owner: Zoo-Code-Org
          repositories: Zoo-Code-Docs
          permission-contents: write

      - name: Dispatch zoo-stable-release to Zoo-Code-Docs
        id: dispatch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.publish-stable.outputs.version }}
          TAG: ${{ needs.publish-stable.outputs.tag }}
          SOURCE_SHA: ${{ needs.publish-stable.outputs.source_sha }}
          RELEASE_URL: ${{ needs.publish-stable.outputs.release_url }}
          CHANGES: ${{ needs.publish-stable.outputs.changes }}
        run: |
          jq -n \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg source_sha "$SOURCE_SHA" \
            --arg release_url "$RELEASE_URL" \
            --arg changes "$CHANGES" \
            '{
              event_type: "zoo-stable-release",
              client_payload: {
                version: $version,
                tag: $tag,
                source_sha: $source_sha,
                release_url: $release_url,
                changes: $changes
              }
            }' | gh api repos/Zoo-Code-Org/Zoo-Code-Docs/dispatches --input -
          echo "Dispatched zoo-stable-release for ${TAG} to Zoo-Code-Org/Zoo-Code-Docs"

      - name: Warn on dispatch failure (non-blocking)
        if: always() && (steps.app-token.outcome == 'failure' || steps.dispatch.outcome == 'failure')
        run: |
          echo "::warning::Docs release dispatch for ${{ needs.publish-stable.outputs.tag }} did not complete. The published extension is unaffected. Re-run failed jobs to retry the dispatch, or check the DOCS_DISPATCH_APP_ID / DOCS_DISPATCH_APP_PRIVATE_KEY secrets and the GitHub App installation on Zoo-Code-Org/Zoo-Code-Docs."
