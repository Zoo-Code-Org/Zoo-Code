name: VS Code Theme Fixtures

on:
    workflow_dispatch:
    pull_request:
        types: [opened, reopened, ready_for_review, synchronize]
        paths:
            - "apps/vscode-e2e/package.json"
            - "apps/vscode-e2e/src/theme-fixtures/**"
            - "packages/types/src/api.ts"
            - "packages/types/src/vscode-extension-host.ts"
            - "src/core/webview/ClineProvider.ts"
            - "src/core/webview/webviewMessageHandler.ts"
            - "src/extension/api.ts"
            - "webview-ui/package.json"
            - "webview-ui/src/App.tsx"
            - "webview-ui/src/utils/useThemeFixtureProbe*"
            - "webview-ui/playwright/index.tsx"
            - "webview-ui/playwright/themes.ts"
            - "webview-ui/playwright/themes/**"
            - "webview-ui/playwright/vscode-theme-base.css"
            - "package.json"
            - "pnpm-lock.yaml"
            - ".github/workflows/vscode-theme-fixtures.yml"
    merge_group:
        types: [checks_requested]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout code
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
              with:
                  persist-credentials: false
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
              with:
                  install-args: "--frozen-lockfile"
            - name: Install xvfb
              run: sudo apt-get install -y xvfb
            - name: Get pinned VS Code version
              id: vscode-version
              run: echo "version=$(node -p 'require("./apps/vscode-e2e/package.json").devDependencies["@types/vscode"]')" >> "$GITHUB_OUTPUT"
            - name: Cache pinned VS Code
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: apps/vscode-e2e/.vscode-test/
                  key: vscode-theme-fixtures-${{ runner.os }}-${{ steps.vscode-version.outputs.version }}-v1
            - name: Check generated VS Code theme fixtures
              run: xvfb-run -a pnpm --filter @roo-code/vscode-e2e themes:check
