name: Changed-code mutation testing

on:
    pull_request:
        types: [edited, opened, reopened, ready_for_review, synchronize]
    merge_group:
        types: [checks_requested]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    mutation-diff:
        name: mutation-diff
        if: github.event_name == 'merge_group' || github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Record merge-queue enforcement
              if: github.event_name == 'merge_group'
              run: |
                  {
                      echo "## Changed-code mutation testing"
                      echo "Mutation testing was enforced on each pull request before it entered the merge queue."
                  } >> "$GITHUB_STEP_SUMMARY" || echo "::warning title=Mutation test advisory::Could not write the job summary"

            - name: Checkout pull request merge result
              if: github.event_name == 'pull_request'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 0
                  persist-credentials: false

            - name: Setup Node.js and pnpm
              if: github.event_name == 'pull_request'
              uses: ./.github/actions/setup-node-pnpm
              with:
                  install-args: "--frozen-lockfile"

            - name: Test mutation gate logic
              if: github.event_name == 'pull_request'
              run: pnpm test:mutation-ci

            - name: Enforce executable-line scope and run advisory mutation testing
              if: github.event_name == 'pull_request'
              env:
                  HEAD_SHA: ${{ github.sha }}
              run: |
                  BASE_SHA="$(git rev-parse "$HEAD_SHA^1")"
                  node scripts/stryker-diff.mjs ci --base "$BASE_SHA" --head "$HEAD_SHA"

            - name: Summarize per-file mutation results
              if: always() && github.event_name == 'pull_request'
              continue-on-error: true
              run: |
                  node --input-type=module - <<'NODE'
                  import fs from "node:fs"
                  import path from "node:path"

                  const REPORT_ROOT = "reports/mutation"
                  const VALID_STATUSES = new Set(["Killed", "Survived", "NoCoverage", "Timeout"])
                  const rows = []
                  const unreadable = []
                  const directories = fs.existsSync(REPORT_ROOT) ? fs.readdirSync(REPORT_ROOT, { withFileTypes: true }) : []

                  for (const directory of directories) {
                      if (!directory.isDirectory()) continue
                      const reportFile = path.join(REPORT_ROOT, directory.name, "mutation.json")
                      if (!fs.existsSync(reportFile)) continue
                      let report
                      try {
                          report = JSON.parse(fs.readFileSync(reportFile, "utf8"))
                      } catch (error) {
                          unreadable.push(directory.name + ": " + error.message)
                          continue
                      }
                      for (const [filePath, file] of Object.entries(report.files ?? {})) {
                          const counts = { mutants: 0, killed: 0, survived: 0, noCoverage: 0 }
                          for (const mutant of file.mutants ?? []) {
                              if (!VALID_STATUSES.has(mutant.status)) continue
                              counts.mutants += 1
                              if (mutant.status === "Killed") counts.killed += 1
                              if (mutant.status === "Survived") counts.survived += 1
                              if (mutant.status === "NoCoverage") counts.noCoverage += 1
                          }
                          if (counts.mutants === 0) continue
                          const absolute = path.resolve(report.projectRoot ?? process.cwd(), filePath)
                          const relative = path.relative(process.cwd(), absolute).replaceAll("\\", "/")
                          rows.push({ file: relative.startsWith("..") ? filePath : relative, ...counts })
                      }
                  }

                  const lines = ["", "### Per-file mutation results", ""]

                  if (rows.length === 0) {
                      lines.push("No Stryker JSON report was produced for this run; see the step log above for the reason.")
                  } else {
                      rows.sort((left, right) => {
                          const blocked = right.survived + right.noCoverage - (left.survived + left.noCoverage)
                          return blocked === 0 ? left.file.localeCompare(right.file) : blocked
                      })
                      lines.push(
                          "Every file below comes from the `changed-code-mutation-report` artifact (`reports/mutation/<package>/mutation.json`). Rows are sorted by Survived + NoCoverage, worst first; Score is Killed / Mutants, counting Timeout mutants as valid but not killed.",
                          "",
                          "| File | Mutants | Killed | Survived | NoCoverage | Score |",
                          "| --- | ---: | ---: | ---: | ---: | ---: |",
                      )
                      for (const row of rows) {
                          const score = ((row.killed / row.mutants) * 100).toFixed(1)
                          lines.push(`| \`${row.file}\` | ${row.mutants} | ${row.killed} | ${row.survived} | ${row.noCoverage} | ${score}% |`)
                      }
                      lines.push(
                          "",
                          "Close a surviving or uncovered mutant with a focused test that fails under the mutation; the artifact does not need to be downloaded to read this table.",
                      )
                  }

                  if (unreadable.length > 0) lines.push("", "Unreadable report(s): " + unreadable.join("; "))

                  const summary = lines.join("\n") + "\n"
                  if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary)
                  else process.stdout.write(summary)
                  NODE

            - name: Upload mutation reports
              id: mutation_report
              if: always() && github.event_name == 'pull_request'
              continue-on-error: true
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: changed-code-mutation-report
                  path: reports/mutation/
                  if-no-files-found: ignore
                  retention-days: 7

            - name: Link mutation report artifact
              if: always() && github.event_name == 'pull_request' && steps.mutation_report.outputs.artifact-url != ''
              env:
                  ARTIFACT_URL: ${{ steps.mutation_report.outputs.artifact-url }}
              run: |
                  {
                      echo ""
                      echo "### Download mutation reports"
                      echo "[Open the changed-code-mutation-report artifact]($ARTIFACT_URL), then open the package's mutation.html file."
                  } >> "$GITHUB_STEP_SUMMARY" || echo "::warning title=Mutation test advisory::Could not write the job summary"
