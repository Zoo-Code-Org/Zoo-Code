name: Changed-code mutation testing

on:
    pull_request:
        types: [edited, opened, reopened, ready_for_review, synchronize]
    merge_group:
        types: [checks_requested]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    classify:
        # Classifies the pull request change range before any validation
        # runs. Only an explicit documentation-only allowlist match can
        # skip expensive jobs, and only for pull_request events; a failed
        # or missing classification fails safe to full validation. The
        # validation-gate job below audits this decision on every run.
        runs-on: ubuntu-latest
        outputs:
            category: ${{ steps.classify.outputs.category }}
            reason: ${{ steps.classify.outputs.reason }}
            reason-code: ${{ steps.classify.outputs.reason-code }}
            changed-files: ${{ steps.classify.outputs.changed-files }}
            allowlist-fingerprint: ${{ steps.classify.outputs.allowlist-fingerprint }}
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # Classification resolves the merge base from history.
                  fetch-depth: 0
                  # This job never pushes — don't persist the GITHUB_TOKEN.
                  persist-credentials: false
            - name: Classify changed files
              id: classify
              uses: ./.github/actions/classify-changes
              with:
                  event-name: ${{ github.event_name }}
                  head-sha: ${{ github.sha }}
                  force-full-label: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full-validation') }}
                  force-full-variable: ${{ vars.ZOO_CODE_REQUIRE_FULL_VALIDATION == 'true' }}

    mutation-diff:
        name: mutation-diff
        needs: classify
        # Fail-safe: only a successful documentation-only classification on
        # a pull request skips this job. Merge-queue validation always runs.
        if: ${{ !cancelled() && (github.event_name == 'merge_group' || github.event.pull_request.draft == false) && (needs.classify.result != 'success' || github.event_name != 'pull_request' || needs.classify.outputs.category != 'docs-only') }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Record merge-queue enforcement
              if: github.event_name == 'merge_group'
              run: |
                  {
                      echo "## Changed-code mutation testing"
                      echo "Mutation testing was enforced on each pull request before it entered the merge queue."
                  } >> "$GITHUB_STEP_SUMMARY" || echo "::warning title=Mutation test advisory::Could not write the job summary"

            - name: Checkout pull request merge result
              if: github.event_name == 'pull_request'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 0
                  persist-credentials: false

            - name: Setup Node.js and pnpm
              if: github.event_name == 'pull_request'
              uses: ./.github/actions/setup-node-pnpm
              with:
                  install-args: "--frozen-lockfile"

            - name: Test mutation gate logic
              if: github.event_name == 'pull_request'
              run: pnpm test:mutation-ci

            - name: Enforce executable-line scope and run advisory mutation testing
              if: github.event_name == 'pull_request'
              env:
                  HEAD_SHA: ${{ github.sha }}
                  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  BASE_SHA="$(git rev-parse "$HEAD_SHA^1")"
                  node scripts/stryker-diff.mjs ci --base "$BASE_SHA" --head "$HEAD_SHA"

            - name: Upload mutation reports
              id: mutation_report
              if: always() && github.event_name == 'pull_request'
              continue-on-error: true
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: changed-code-mutation-report
                  path: reports/mutation/
                  if-no-files-found: ignore
                  retention-days: 7

            - name: Link mutation report artifact
              if: always() && github.event_name == 'pull_request' && steps.mutation_report.outputs.artifact-url != ''
              env:
                  ARTIFACT_URL: ${{ steps.mutation_report.outputs.artifact-url }}
              run: |
                  {
                      echo ""
                      echo "### Download mutation reports"
                      echo "[Open the changed-code-mutation-report artifact]($ARTIFACT_URL), then open the package's mutation.html file."
                  } >> "$GITHUB_STEP_SUMMARY" || echo "::warning title=Mutation test advisory::Could not write the job summary"

    validation-gate:
        # Always-running required gate for change-based validation. It
        # rejects a missing or failed classification, validation jobs that
        # did not run when full validation was required, jobs that ran when
        # a documentation-only skip was expected, and a classifier replay
        # that disagrees with the recorded classification. It also records
        # the classification, the skipped work, runner minutes, and the
        # required-check completion time in the job summary.
        if: always()
        needs:
            - classify
            - mutation-diff
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # The gate replays the classifier against the same range.
                  fetch-depth: 0
                  # This job never pushes — don't persist the GITHUB_TOKEN.
                  persist-credentials: false
            - name: Run validation gate
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NEEDS_JSON: ${{ toJSON(needs) }}
                  EVENT_NAME: ${{ github.event_name }}
                  PR_DRAFT: ${{ github.event.pull_request.draft }}
                  RUN_ID: ${{ github.run_id }}
                  HEAD_SHA: ${{ github.sha }}
                  FORCE_FULL_LABEL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full-validation') }}
                  FORCE_FULL_VARIABLE: ${{ vars.ZOO_CODE_REQUIRE_FULL_VALIDATION == 'true' }}
                  WATCHED_JOBS: mutation-diff:pr-non-draft:gated
              run: |
                  BASE_SHA="$(git rev-parse "${HEAD_SHA}^1")"
                  node scripts/change-gate.mjs ci --base "$BASE_SHA" --head "$HEAD_SHA"
