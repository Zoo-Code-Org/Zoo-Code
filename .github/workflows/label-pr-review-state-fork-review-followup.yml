name: Label PR review state fork review follow-up

on:
    # Fork pull_request_review runs of "Label PR review state" get a read-only
    # token and skip their label writes (issue #2046). When such a run
    # completes, this privileged follow-up resolves the fork PRs and dispatches
    # a workflow_dispatch run of "Label PR review state", which reconciles them
    # and writes the computed labels. The follow-up lives in its own workflow
    # because GitHub rejects a workflow that lists itself in
    # workflow_run.workflows (issue #2086). It takes no artifact input and
    # never checks out code, so no untrusted PR code or artifacts are touched.
    workflow_run:
        workflows: ["Label PR review state"]
        types: [completed]

permissions:
    # This privileged workflow only reads PR metadata and dispatches the
    # reconciliation workflow. All unspecified permissions, including contents,
    # are none; no fork code or configuration is checked out or executed.
    actions: write
    pull-requests: read

# Coalesce by target, not by triggering run (2026-11-18 storm: this workflow
# started 243 runs in 78 minutes and dispatched 73 of them). Keying per
# triggering run id gave every completion its own group, so nothing ever
# coalesced: the six required checks of one PR all completing at the same head
# meant six queued dispatches of the same work. GitHub keeps at most one
# running plus one pending run per group, so keying the group by the target the
# completed run evaluated collapses a burst into a single dispatch of the
# freshest state: first by the PR number GitHub associates with the run, then,
# for fork runs whose pull_requests GitHub leaves empty (issue #2133), by the
# branch identity the resolver below actually matches on.
#
# The fork fallback must include the branch, not just the head SHA. Two fork PRs
# can carry the same commit on different branches (a cherry-picked stack does
# exactly that), and the resolver distinguishes them only by head branch: a
# SHA-only key would put both PRs in one group, so a pending run for the second
# branch would be superseded by a later completion for the first and its
# reconciliation would never dispatch. head_branch, together with the head
# repository owner it belongs to, is the resolver's branch identity, so two
# branches never share a group. Two distinct branches carrying the same commit
# do not coalesce, which is the intended correction: they are different PR
# targets. Repeated completions for one target share branch and SHA and still
# coalesce.
#
# GitHub compares group names case-insensitively, so two branches that differ
# only by letter case - feature/a and feature/A, which two forks can hold at
# the same commit - do share a group. That is accepted instead of fought: the
# resolver below compares head branches case-insensitively as well, so
# whichever run survives reconciles every PR the group stands for rather than
# only the one whose spelling happened to arrive first.
#
# cancel-in-progress stays false: a running dispatch must finish every PR it
# resolved, so only pending duplicates are dropped. The run id is the last
# fallback so a payload with neither an associated PR nor a head branch and SHA
# keeps a unique group instead of every such run colliding on one key.
concurrency:
    group: >-
        label-pr-review-state-fork-review-followup-${{
          github.event.workflow_run.pull_requests[0].number ||
          ((github.event.workflow_run.head_branch && github.event.workflow_run.head_sha) &&
            format('{0}:{1}@{2}',
              github.event.workflow_run.head_repository.owner.login || 'unknown',
              github.event.workflow_run.head_branch,
              github.event.workflow_run.head_sha)) ||
          github.event.workflow_run.id
        }}
    cancel-in-progress: false

jobs:
    dispatch:
        name: Zoo Code / dispatch fork review reconciliation
        # Loop guard (issue #2046): follow up only on runs triggered by
        # pull_request_review. The runs this workflow dispatches have event
        # 'workflow_dispatch', so their completion is filtered out here and
        # the chain stops after one hop.
        if: github.event.workflow_run.event == 'pull_request_review'
        runs-on: ubuntu-latest
        steps:
            - name: Resolve fork PRs and dispatch reconciliation
              uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
              with:
                  retries: 3
                  script: |
                      const { owner, repo } = context.repo;
                      const run = context.payload.workflow_run;

                      // Mirrors the job-level `if`: only runs triggered by
                      // pull_request_review need a follow-up, so the chain
                      // stops after one hop.
                      if (run?.event !== 'pull_request_review') {
                        core.info(`Ignoring workflow_run with event '${run?.event}'`);
                        return;
                      }

                      // GitHub reports the base repository as head_repository on
                      // every pull_request_review run, fork PR or not (issue
                      // #2133), so the payload cannot tell fork from same-repo
                      // runs. Dispatching for a same-repo PR is idempotent: the
                      // reconciliation writes the same labels, and its completion
                      // carries event 'workflow_dispatch', which the guard above
                      // filters out.
                      //
                      // Resolve which PRs the completed run targeted. Review runs
                      // backfill pull_requests empty for fork PRs, and the head
                      // owner is not recoverable from head_repository, so the
                      // fallback lists open PRs and matches the head branch
                      // case-insensitively, the head SHA, and the base repository.
                      // Group names are compared case-insensitively above, so a
                      // case-sensitive match here would let the run that survived the
                      // shared group reconcile only its own branch's PR and drop the
                      // other target - the failure the key exists to avoid. GitHub's
                      // own identity comparisons (usernames, the base repository
                      // below) are case-insensitive too.
                      // The workflow_run branch of label-pr-review-state.yml keeps an
                      // owner-and-branch query instead: its runs are CI runs triggered
                      // by pull_request, whose head_repository is the real fork.
                      let prNumbers = [];
                      if (run.pull_requests?.length > 0) {
                        prNumbers = run.pull_requests.map(pr => pr.number);
                      } else if (run.head_branch && run.head_sha) {
                        const candidates = await github.paginate(github.rest.pulls.list, {
                          owner,
                          repo,
                          state: 'open',
                          per_page: 100,
                        });
                        const baseRepository = `${owner}/${repo}`.toLowerCase();
                        prNumbers = candidates
                          .filter(pr =>
                            pr.head?.sha === run.head_sha &&
                            pr.head?.ref?.toLowerCase() === run.head_branch?.toLowerCase() &&
                            pr.base?.repo?.full_name?.toLowerCase() === baseRepository
                          )
                          .map(pr => pr.number);
                        core.info(
                          `Resolved workflow_run ${run.id ?? '(unknown)'} to ` +
                          `${prNumbers.length} PR(s) by case-insensitive head branch, SHA, and base repository`
                        );
                      }

                      // Each dispatch starts a privileged workflow_dispatch run of the
                      // reconciliation workflow for one PR. Its completion re-triggers
                      // this workflow, but the loop guard above filters it out.
                      // A failed dispatch must not skip the PRs after it: collect the
                      // failures and fail the step once, naming each PR.
                      const failures = [];
                      for (const prNumber of prNumbers) {
                        try {
                          await github.rest.actions.createWorkflowDispatch({
                            owner,
                            repo,
                            workflow_id: 'label-pr-review-state.yml',
                            ref: 'main',
                            inputs: { pull_request_number: String(prNumber) },
                          });
                          core.info(`Dispatched label-pr-review-state.yml for PR #${prNumber}`);
                        } catch (error) {
                          failures.push(`#${prNumber}: ${error.message}`);
                        }
                      }
                      if (failures.length > 0) {
                        core.setFailed(`Failed to dispatch ${failures.length} PR(s): ${failures.join('; ')}`);
                      }
