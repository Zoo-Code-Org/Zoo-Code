name: Webview CI benchmark (temporary)

on:
    push:
        branches: [tmp/ci-check]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: webview-benchmark-${{ github.ref }}
    cancel-in-progress: true

jobs:
    benchmark:
        name: webview benchmark (${{ matrix.os }}, ${{ matrix.workers }} workers)
        runs-on: ${{ matrix.os }}
        timeout-minutes: 35
        strategy:
            fail-fast: false
            max-parallel: 2
            matrix:
                os: [ubuntu-latest, windows-latest]
                workers: [1, 2, 4]
        steps:
            - name: Checkout benchmark source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
              with:
                  install-args: "--frozen-lockfile"
            - name: Build shared test prerequisite
              run: pnpm --filter @roo-code/types build
            # Invoke Vitest directly: Turbo must not replay a cached test result.
            # The runner gives each repetition a fresh Vite cache and coverage directory.
            - name: Measure two full-suite repetitions
              env:
                  WEBVIEW_BENCHMARK_COVERAGE: ${{ matrix.os == 'ubuntu-latest' }}
                  TZ: UTC
              run: node scripts/ci/webview-benchmark.mjs --workers ${{ matrix.workers }} --repetitions 2
            - name: Upload raw benchmark evidence
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: webview-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-w${{ matrix.workers }}
                  path: |
                      benchmark-results/**/metadata.json
                      benchmark-results/**/modules.json
                      benchmark-results/**/*.log
                      benchmark-results/**/coverage/lcov.info
                  if-no-files-found: warn
                  retention-days: 7

    compare:
        name: Compare benchmark inventories and coverage
        needs: benchmark
        if: ${{ always() && !cancelled() }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Checkout comparison script
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: "22.23.4"
            - name: Download evidence from this attempt
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: webview-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-*
                  path: benchmark-results
            - name: Compare complete cases
              run: node scripts/ci/webview-benchmark.mjs --summarize --output benchmark-results
            - name: Upload machine-readable comparison
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: webview-comparison-${{ github.run_id }}-${{ github.run_attempt }}
                  path: benchmark-results/comparison.json
                  if-no-files-found: warn
                  retention-days: 7
