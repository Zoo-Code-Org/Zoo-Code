body:
    - type: markdown
      attributes:
          value: |
              Thank you. You propose a new provider for Zoo Code.

              This Discussion is a forum. It is not an application form. All questions are optional. Users and maintainers give feedback in the thread. A maintainer decides when to merge a listing pull request. The result can be "not listed". You can then use the OpenAI Compatible provider.

              A listing is not an endorsement. It is not a certification of security or functionality.
    - type: input
      id: operator
      attributes:
          label: Who operates the service?
          description: Write the name of the company or person that operates the service.
      validations:
          required: false
    - type: textarea
      id: model-source
      attributes:
          label: Where do the models come from? Does the operator resell access?
          description: For example, first-party API access, or resold access to another provider.
      validations:
          required: false
    - type: textarea
      id: model-route-access
      attributes:
          label: How does the operator get access to each model route?
          description: For each route, write if it uses a first-party, reseller, partner, or cloud-marketplace agreement. Note any route that uses a subscription or OAuth account.
      validations:
          required: false
    - type: textarea
      id: prompt-handling
      attributes:
          label: What happens to prompts?
          description: Link to the privacy policy and the terms of service, if they exist.
      validations:
          required: false
    - type: textarea
      id: gateways-subprocessors
      attributes:
          label: Does any gateway provider or subprocessor handle prompts?
          description: List each one, or its category and location. Do no-retention and no-training terms bind it?
      validations:
          required: false
    - type: textarea
      id: default-privacy-mode
      attributes:
          label: What can the operator or a supplier keep or train on in the default privacy mode?
          description: If a request asks for a stricter mode and a supplier cannot support it, does the service reject the request?
      validations:
          required: false
    - type: textarea
      id: public-artifacts
      attributes:
          label: Does the provider have a public repository, a license, documentation, and an issue tracker?
      validations:
          required: false
    - type: textarea
      id: maintenance
      attributes:
          label: Who maintains the service? When was the last update?
      validations:
          required: false
    - type: input
      id: author-affiliation
      attributes:
          label: Do you have a link to the operator?
          description: For example, you work for the operator, or you are a user with no link to the operator.
      validations:
          required: false
